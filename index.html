<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electricity Bill Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>⚡ Electricity Bill Generator</h2>

    <label>Consumer Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Units Consumed</label>
    <input type="number" id="units" placeholder="Enter units">

    <button onclick="calculateBill()">Generate Bill</button>
    <button onclick="resetForm()" class="reset">Reset</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
